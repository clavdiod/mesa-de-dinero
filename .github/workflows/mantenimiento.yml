name: mantenimiento
# 1) Pruebas en cada cambio.  2) Pulso semanal: GitHub apaga los workflows programados de un repo
#    público tras 60 días sin actividad; este job hace un commit mínimo para que no se apaguen.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  pulso:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .pulso
          git config user.name "mesa-bot"
          git config user.email "mesa-bot@users.noreply.github.com"
          git add .pulso
          git commit -m "pulso semanal" || exit 0
          git push
