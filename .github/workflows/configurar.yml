name: configurar
# Prueba de una sola vez, se corre a mano desde la pestaña Actions.
# OJO: el repo es público y sus logs también. Este job no imprime secretos ni datos personales.
on:
  workflow_dispatch:

jobs:
  probar-iol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probar IOL y descubrir paneles
        env:
          MESA_WORKER_URL: ${{ secrets.MESA_WORKER_URL }}
          MESA_INGESTA_TOKEN: ${{ secrets.MESA_INGESTA_TOKEN }}
          IOL_USUARIO: ${{ secrets.IOL_USUARIO }}
          IOL_CLAVE: ${{ secrets.IOL_CLAVE }}
        run: PYTHONPATH=. python scripts/probar_iol.py
