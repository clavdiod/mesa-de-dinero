name: ronda
# Corre cada 5 minutos en horario de mercado (10:30-17:00 ART = 13:30-20:00 UTC), lunes a viernes.
# El código decide si a esa ronda le toca (5 min en la primera y última hora, 10 al mediodía,
# más espaciado si el cupo de IOL viene ajustado) y saltea feriados.
on:
  schedule:
    - cron: "30-59/5 13 * * 1-5"
    - cron: "*/5 14-19 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr aunque no toque (botón Analizar ahora)"
        default: "true"

concurrency:
  group: mesa
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ronda de la mesa
        env:
          MESA_WORKER_URL: ${{ secrets.MESA_WORKER_URL || 'https://mesa-de-dinero.clavdio81.workers.dev' }}
          MESA_INGESTA_TOKEN: ${{ secrets.MESA_INGESTA_TOKEN }}
          IOL_USUARIO: ${{ secrets.IOL_USUARIO }}
          IOL_CLAVE: ${{ secrets.IOL_CLAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          VAPID_PUBLICA: ${{ secrets.VAPID_PUBLICA }}
          VAPID_CONTACTO: ${{ secrets.VAPID_CONTACTO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forzar }}" = "true" ]; then
            python -m mesa.ronda --forzar
          else
            python -m mesa.ronda
          fi
