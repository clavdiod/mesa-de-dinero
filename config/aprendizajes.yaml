# Bitácora de aprendizajes: qué pasó, qué se aprendió y qué regla cambió.
# Se muestra en la web (pestaña Agentes). Lo más nuevo arriba.
- fecha: "2026-10-21"
  caso: "Llegó el Economista (contexto macro argentino)"
  que_paso: "Se probó con la historia de 56 papeles la regla de manual: si el riesgo país baja, comprar bancos, acciones y bonos; si el dólar se acelera, CEDEARs. Su opinión propia acertó 41% (1.043 casos). Y las señales de los demás que iban a favor de su contexto rindieron -1,7% a 10 ruedas, contra +0,8% de las que iban en contra."
  leccion: "En este último año, cuando el contexto ya era bueno el mercado ya lo había descontado: después de un mes de riesgo país en baja, los papeles tendieron a devolver. Las reglas de manual no alcanzan si el precio ya las reflejó."
  cambio: "El Economista explica el contexto todos los días (Mercado), pero su voto quedó en el mínimo y su ajuste sobre los demás está en pausa hasta que la historia muestre que mejora resultados. Se vuelve a medir en cada entrenamiento."
- fecha: "2026-10-21"
  caso: "Entrenamiento con la historia (56 papeles: 18 acciones y 38 CEDEARs, ~1 año)"
  que_paso: "Se hizo opinar a los agentes en cada día pasado y se midió qué pasó 10 ruedas después. Con solo 18 acciones, los rebotes de Técnico parecían buenos (62%), pero al sumar los CEDEARs bajaron a 52% y +0,3% promedio: menos que la comisión. Los quiebres de Técnico acertaron 45% (-0,7%) y Fuerza relativa 48% (-0,4%) sobre más de 1.500 casos."
  leccion: "Con pocos datos una regla puede parecer buena por casualidad. Hoy ninguna de las reglas técnicas simples gana más que la comisión: la mesa no les puede creer de más."
  cambio: "Su voto quedó en el mínimo (x0,3) hasta que demuestren lo contrario. Una señal solo vota completo si, además de acertar, gana más que el 1,2% de comisión. Se recalibra cada viernes y el historial de CEDEARs ahora se arma gratis, así cada semana hay más casos."
- fecha: "2026-10-20"
  caso: "Comité para las oportunidades"
  que_paso: "Las oportunidades salían de un solo agente, sin que el resto de la mesa opinara. De 13 simuladas, 12 eran de un agente solo y casi todas perdían."
  leccion: "Con tantos analistas, una idea que nadie más confirma no se muestra."
  cambio: "Una oportunidad solo aparece si otro analista con un método distinto la confirma, nadie la ataca con fuerza y pasa Riesgo. Técnico e Historiador ahora opinan sobre cada una. Las demás quedan 'en observación': se miden en papel pero no se muestran."
- fecha: "2026-10-20"
  caso: "TXAR (ganadora)"
  que_paso: "El agente de Oportunidades (mediano) la marcó a las 11:51 a 690,50: tendencia alcista y retroceso a su media de 50. Subió con volumen 3 veces el normal y a las 16:41 el Jefe recién la propuso, a 715 (3,5% más cara), porque las oportunidades se calculaban después de que él decidía y por sí sola no llegaba al puntaje."
  leccion: "La señal buena estaba temprano; el Jefe llegó tarde y persiguiendo la suba."
  cambio: "Las oportunidades ahora se calculan antes del Jefe y suman en su puntaje. Si un papel ya subió 2,5% o más en el día, la entrada va con límite medio ATR más abajo (no se persigue)."
- fecha: "2026-10-20"
  caso: "11 CEDEARs 'baratos' (CAR, NG, MOS, HL, DELL, SE, HOOD, RIOT, OKLO, KLAC, PLD)"
  que_paso: "Se marcaron con dólar implícito entre 11% y 78% debajo del promedio. Un desvío real entre CEDEARs es de 1% a 3%: esos números salían de precios viejos de la línea en dólares, que no había operado. 8 de 11 bajaron en el día. El Jefe no los tomó (no tenían historial para armar un plan), y eso estuvo bien."
  leccion: "Un 'descuento' enorme casi siempre es un dato malo, no una oportunidad."
  cambio: "Solo cuentan CEDEARs con las dos líneas (pesos y dólares) operadas hoy, más de $20 millones operados, desvío entre 3% y 6%, y como máximo 3 por día."
- fecha: "2026-10-20"
  caso: "METR (perdedora)"
  que_paso: "Se marcó como 'tendencia alcista, retroceso a la media', pero hace dos meses que va de costado entre 2.255 y 2.442. Estaba encima de sus medias por poco, sin tendencia real."
  leccion: "Estar arriba de las medias no alcanza: las medias tienen que venir subiendo."
  cambio: "Para 'tendencia alcista' la media de 50 ruedas tiene que haber subido al menos 1% en las últimas 20 ruedas."
- fecha: "2026-10-20"
  caso: "Resultado en rojo de entrada"
  que_paso: "Toda operación simulada arranca 1,2% abajo por la comisión de compra y venta."
  leccion: "Una oportunidad tiene que apuntar a bastante más que 1,2% para que valga la pena."
  cambio: "La simulación muestra el movimiento del precio y el resultado con comisión por separado."
