# Reglas de la mesa (02/11/2026). Las cumplen TODOS los agentes, sin excepción. Se aplican en el Comité y en cada plan
# de los Anticipadores: ninguna propuesta llega a Clau si no las pasa. El agente que no aporte aciertos es dado de baja.
- "Antes de proponer, revisar el precio de entrada: si está 6% o más arriba de su promedio de 20 ruedas o en el 15% más alto de sus 3 meses, es CARA y se descarta. En CEDEARs, también si está en el 20% más alto del año (en acciones argentinas no: ahí lo que sube sigue subiendo, probado con 10 años)."
- "Hasta el máximo del último año tiene que haber al menos el doble de lo que se arriesga hasta el stop. Si no, no paga y se descarta."
- "El objetivo nunca puede estar arriba del máximo del último año sin decirlo: es irreal."
- "Mostrar siempre cuánto puede subir según la historia (lo típico y lo que pasa 1 de cada 4 veces) y el análisis en frío ANTES de comprar."
- "No comprar acciones argentinas que siguen cayendo o perforaron su mínimo anual: esperar a que dejen de caer."
- "Solo proponen los analistas probados con la historia (Anticipadores, Cazador de ganadores, Wall Street, Técnico). Pánico, Corresponsal y Anticipo NY solo confirman."
- "Ideas de 2 semanas o más. No vender un ganador solo por llegar al objetivo: alarma de venta que asegura la mitad de lo mejor ganado."
- "A Clau solo le llega lo suyo: su cartera, su lista, sus cobros y las compras aprobadas."
- "Baja del equipo: el agente que, con 10 o más ideas cerradas, acierta menos de 35 de cada 100, deja de votar hasta que vuelva a aprobar el examen."
- "Leer el gráfico en cada compra: máximo del año, próximo techo y piso con sus toques, y el volumen. En acciones argentinas un piso NO protege (se perfora 7 de cada 10 veces): el stop va debajo. Un día con el doble de volumen es buena señal en acciones argentinas."
